<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storey · Seller and fulfillment wireframes</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2ed;color:#202c2a;font:16px/1.5 system-ui,sans-serif}header,nav,main,footer{padding:16px max(5vw,20px)}header{background:#153a35;color:white;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font:bold 30px Georgia}nav{background:white;border-bottom:1px solid #ccd4ce;display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:9px;border:1px solid #97a69e;border-radius:5px;background:white;color:#203e36}button{cursor:pointer}button:hover,button:focus-visible{outline:2px solid #608b7c}button[aria-current=true],button.primary{background:#17584b;color:white}main{max-width:1380px;margin:auto}h1{font:normal clamp(32px,4vw,50px) Georgia;margin:10px 0 18px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px}article,aside,details{background:white;border:1px solid #ced7d0;border-radius:9px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}label{display:grid;gap:4px;margin:10px 0}input,select{max-width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.k{display:block;color:#45675a;font:600 12px/1.5 monospace;letter-spacing:.08em;text-transform:uppercase}.metric{font:bold 31px Georgia;color:#15574a}.hint,small{color:#53655d}.notice{background:#fff3cd;padding:12px;border-left:4px solid #bb7e15}table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid #dde4de;text-align:left}summary{cursor:pointer;font-weight:bold}.chip{background:#e0eee5;padding:4px 8px;border-radius:4px}.stage{color:#547166;font-size:14px}footer{font-size:13px;color:#526158}button:disabled{opacity:.48;cursor:default}@media(max-width:760px){.grid{display:block}header{align-items:flex-start}.wide{overflow:auto}nav button{flex:1}article,aside{padding:15px}}
</style><header><b>Storey</b><span>Interactive design review · Israel pilot</span></header><nav id="nav" aria-label="Wireframe views"></nav><main id="main"></main><footer>Illustrative ILS amounts · English review copy · simulated actions in this tab · refresh to reset</footer>
<script>
const pages=['Pricing','Campaign reservations','Social link builder','Fulfillment queue','Flow specifications','Admin catalog importer'];let page=0,tier='Branded Store',msg='',cost=20,retail=40,version=1,seen=1,mode='Fixed price',entry=40,res=0,end=0,ttl=24,overflow=false,link=null,serial=0,qty=1,plates=0,camp=false,expires=24,publicView=false,work=null,queueFilter='All',notice='';

const $=id=>document.getElementById(id),money=n=>'₪'+n.toFixed(2),chosen=(a,b)=>a===b?'selected':'',btn=(s,a,c='')=>'<button class="'+c+'" onclick="'+a+'">'+s+'</button>',go=n=>{page=n;msg='';publicView=false;seen=version;render()},tell=t=>{msg=t;render()},field=(s,html)=>'<label>'+s+html+'</label>',num=(id,v,min=0)=>'<input type="number" id="'+id+'" min="'+min+'" value="'+v+'">',read=id=>Number($(id).value),hr=(n)=>new Date(n).toLocaleString('en-GB',{timeZone:'Asia/Jerusalem',hour12:false}),item='Foil balloon set · BAL-10',now=()=>Date.now();
function render(){if(res&&now()>=end){res=0;msg='Campaign expired. Unused units returned to shared stock.'} $('nav').innerHTML=pages.map((p,i)=>'<button aria-current="'+(i===page)+'" onclick="go('+i+')">'+p+'</button>').join('');$('main').innerHTML='<span class="k">'+(page<3?'Seller workspace · Maya Studio':page===3?'Supplier workspace · Central warehouse':page===5?'Admin workspace · Catalog operations':'Design handoff')+'</span><h1>'+pages[page]+'</h1>'+(page<3?field('Preview seller plan','<select onchange="tier=this.value;msg=\'\';publicView=false;render()">'+['Social Seller','Branded Store','Scale Partner'].map(x=>'<option '+chosen(x,tier)+'>'+x+'</option>').join('')+'</select>'):'')+(msg?'<p role="status" class="notice">'+msg+'</p>':'<span role="status"></span>')+[pricing,reserve,links,warehouse,flows,importer][page]();if(page===0)calc()}
function pricing(){return '<div class="grid"><article><span class="k">Listing · pricing editor</span><h2>'+item+'</h2><p>Published retail price <b>'+money(retail)+'</b> per pack</p>'+field('Pricing method','<select onchange="mode=this.value;entry=mode===\'Fixed price\'?retail:100;render()"><option '+chosen(mode,'Fixed price')+'>Fixed price</option><option '+chosen(mode,'Cost markup')+'>Cost markup</option></select>')+field(mode==='Fixed price'?'New price per pack (₪)':'Markup on wholesale (%)','<input id="price" type="number" step=".01" value="'+entry+'" oninput="entry=this.value;calc()">')+btn('Publish price','publishPrice()','primary')+'</article><aside><span class="k">Per pack · illustrative zero-tax fixture</span><h2>Expected seller proceeds</h2><div id="math"></div><p class="hint">Buyer freight covers supplier freight in this example. Production quotes show tax and fulfillment charges per line.</p>'+btn('Simulate supplier cost +₪5','cost+=5;version++;tell(\'Supplier cost changed. Review the updated economics before publishing.\')')+'</aside></div>'}
function proposed(){return Math.round((mode==='Fixed price'?Number(entry):cost*(1+Number(entry)/100))*100)/100}function calc(){let p=proposed(),fee=Math.round(p*5)/100;$('math').innerHTML='<b class="metric">'+money(p-cost-fee)+'</b><p>Retail '+money(p)+'<br>Wholesale '+money(cost)+'<br>Platform fee (5%) '+money(fee)+'<br>Merchandise margin '+(p>0?((p-cost)/p*100).toFixed(1):'0')+'%</p>'}
function publishPrice(){let p=proposed();if(entry===''||p<=0||p-cost-Math.round(p*5)/100<0)return tell('Price must be positive and cover wholesale and fees.');if(seen!==version){seen=version;return tell('Cost version updated. Check proceeds and press Publish price again to confirm.')}retail=p;tell('Published. New quotes use '+money(p)+'. Existing locked quotes retain their price.')}
function reserve(){let shared=40-res;return '<div class="grid"><article><span class="k">Campaign · Birthday launch</span><h2>'+item+'</h2>'+(tier==='Social Seller'?'<p>Campaign reservations are available on Branded Store and Scale Partner. Social links can sell from shared inventory.</p>'+btn('Build a social link','go(2)'):res?'<p><b class="metric">'+res+'</b> packs reserved</p><p>Expires '+hr(end)+' Israel time. Shared overflow '+(overflow?'enabled':'disabled')+'.</p>'+btn('Build campaign link','camp=true;go(2)','primary')+' '+btn('Release unused units','if(confirm(\'Release unused campaign stock now?\')){res=0;tell(\'Released to shared inventory. Campaign-only links are closed.\')}'):field('Packs to reserve',num('units',6,1))+field('Duration in hours (1–72)',num('hours',ttl,1))+field('If campaign stock sells out','<select id="fallback"><option>Stop campaign checkout</option><option>Allow shared stock</option></select>')+btn('Confirm reservation','hold()','primary'))+'</article><aside><span class="k">Warehouse availability</span><p><b class="metric">'+shared+'</b> shared packs</p><p>'+res+' campaign packs · Pilot cap 8 per campaign</p><p>Campaign stock is exclusive to the linked campaign until expiry. Opening a social link holds zero units.</p></aside></div>'}
function hold(){let n=read('units'),h=read('hours');if(!Number.isInteger(n)||n<1||n>8||!Number.isInteger(h)||h<1||h>72)return tell('Reservation declined. Enter 1–8 whole packs and a duration of 1–72 hours.');res=n;ttl=h;end=now()+h*3600000;overflow=$('fallback').selectedIndex===1;tell('Reservation confirmed. Attach it to a social link.')}
function links(){let valid=link&&link.active&&link.until>now()&&(!link.c||res>0&&link.e===end);if(publicView&&link)return '<article><span class="k">Mobile buyer preview · Maya Studio</span><section dir="rtl" lang="he"><h2>ערכת יום הולדת</h2><p>מארז בלונים × '+link.q+' · צלחות מסיבה × '+link.p+'</p><b>'+money(link.q*retail+link.p*12)+'</b><p>'+(valid?'המחיר הסופי והמשלוח יחושבו בקופה':'הקישור אינו פעיל')+'</p></section>'+btn('Back to builder','publicView=false;render()')+'</article>';return '<div class="grid"><article><span class="k">Compose · Birthday kit</span><h2>Products and quantities</h2>'+field(item+' · '+money(retail),num('balloons',qty))+field('Paper plates · PLT-08 · ₪12.00',num('plates',plates))+field('Inventory source','<select id="source"><option>Shared inventory</option>'+(res&&tier!=='Social Seller'?'<option '+(camp?'selected':'')+'>Birthday launch reservation</option>':'')+'</select>')+field('Link lifetime in hours',num('life',expires,1))+btn(link?'Replace current link':'Generate checkout link','generate()','primary')+'</article><aside><span class="k">Share and preview</span>'+(link?'<h2>Birthday kit</h2><p>'+link.q+' balloon packs · '+link.p+' plate packs</p><p>Status <b>'+(valid?'Active':'Closed')+'</b><br>Expires '+hr(link.until)+' Israel time</p><code>storey.example/s/'+link.id+'</code><p>'+btn('Copy share text','copyText()')+' '+btn('Buyer preview','publicView=true;render()')+'</p>'+btn('Revoke link','link.active=false;tell(\'Link revoked. Existing orders remain accessible.\')'):'<p>Generate a link to preview the buyer page and copy a WhatsApp-ready message.</p>')+'</aside></div>'}
function generate(){let q=read('balloons'),p=read('plates'),h=read('life'),c=$('source').selectedIndex===1;if(![q,p,h].every(Number.isInteger)||q<0||p<0||q+p<1||h<1||h>720||q>(c?(overflow?40:res):40-res)||p>20||c&&!q)return tell('Check quantities, available packs and link duration (1–720 hours). Campaign links require a reserved balloon pack.');qty=q;plates=p;expires=h;camp=c;link={id:'kit-'+(++serial),q,p,c,e:end,active:true,until:Math.min(now()+3600000*h,c?end:Infinity)};tell('Demo link generated. Copying a link creates no checkout hold.')}
async function copyText(){let t='Birthday kit from Maya Studio · https://storey.example/s/'+link.id;try{await navigator.clipboard.writeText(t);tell('Share text copied. The example URL is for design review.')}catch{prompt('Copy share text',t)}}
function warehouse(){if(!work)return '<article><span class="k">Dispatch queue · Israel time</span><h2>Orders by handoff deadline</h2>'+field('Queue filter','<select onchange="queueFilter=this.value;render()">'+['All','Open','Dispatched'].map(x=>'<option '+chosen(x,queueFilter)+'>'+x+'</option>').join('')+'</select>')+'<div class="wide"><table><tr><th>Order</th><th>Due</th><th>Pool</th><th>State</th><th>Task</th></tr>'+jobs.filter(j=>queueFilter==='All'||(queueFilter==='Dispatched')===(j.stage==='Dispatched')).map(j=>'<tr><td>'+j.id+'</td><td>'+j.due+'</td><td>'+j.pool+'</td><td>'+j.stage+'</td><td>'+btn('Open',"openJob("+jobs.indexOf(j)+")")+'</td></tr>').join('')+'</table></div></article>';let j=work;return btn('← Dispatch queue','work=null;msg=\'\';render()')+'<div class="grid"><article><span class="k">'+j.id+' · '+j.stage+'</span><h2>'+item+'</h2><p class="stage">Accept → Pick → Pack → Label → Handoff</p>'+(j.blocked?'<p class="notice">'+j.blocked+'</p>'+btn('Confirm stock or material recovered','work.blocked=\'\';work.material=true;tell(\'Exception resolved after warehouse recount. Resume scanning.\')'):j.stage==='Queued'?btn('Accept pick task','advance(\'Picking\')','primary'):j.stage==='Picking'?field('Scan bin · expected '+j.bin,'<input id="bin" autocomplete="off">')+field('Scan one pack · expected BAL-10','<input id="scan" autocomplete="off" onkeydown="if(event.key===\'Enter\')pick()">')+btn('Confirm scan','pick()','primary')+' '+btn('Report short pick','work.blocked=\'Short pick. Remaining units held for recount. Operations reviews partial shipment or refund.\';render()'):j.stage==='Packing'?(j.tier==='Scale Partner'?field('Scan required insert · INS-MAYA','<input id="insert">')+btn('Report missing insert','work.blocked=\'Packing blocked. Replenish INS-MAYA or obtain recorded contract approval for a fallback.\';render()'):'<p>Standard supplier packaging.</p>')+' '+btn('Seal parcel','pack()','primary'):j.stage==='Packed'?btn('Create thermal label','work.label=true;advance(\'Label ready\')','primary'):j.stage==='Label ready'?'<p>Label L-'+j.id+' · 4 × 6 in · one sealed parcel</p>'+btn('Confirm physical carrier handoff','advance(\'Dispatched\')','primary'):'<p>Handoff recorded. Tracking notification queued.</p>')+'</article><aside><span class="k">Pick ticket</span><h2>'+j.pool+'</h2><p>Bin <b>'+j.bin+'</b> · '+j.tier+'</p><b class="metric">'+j.picked+' / '+j.need+'</b> packs scanned<p>Dispatch by '+j.due+' · SLA ends at handoff.</p><p>Packaging: '+(j.tier==='Scale Partner'?'Branded box + INS-MAYA insert':'Standard box')+'</p></aside></div>'}
function openJob(i){work=jobs[i];msg='';render()}function advance(s){work.stage=s;msg='';render()}function pick(){if($('bin').value.trim()!==work.bin||$('scan').value.trim()!=='BAL-10')return tell('Scan mismatch. Verify bin and SKU. Picked quantity unchanged.');work.picked++;if(work.picked===work.need)advance('Packing');else tell('One pack confirmed. Scan the next pack.')}function pack(){if(work.tier==='Scale Partner'&&$('insert').value.trim()!=='INS-MAYA')return tell('Required insert scan missing or incorrect. Parcel remains open.');advance('Packed')}
function flows(){return '<article><h2>Interaction and handoff specifications</h2><p>Each row describes the production flow. The other tabs simulate its principal controls with local sample data.</p><div class="wide"><table><tr><th>Entry and action</th><th>Success and next step</th><th>Failure and recovery</th><th>FRD trace</th></tr>'+[
['Seller opens listing → selects fixed price or markup → reviews fee, tax, freight and proceeds → publishes','Save against cost version. New quotes use the revised price. Show prior and current price.','Cost changed: show revised economics and request confirmation. Negative proceeds: keep listing paused until corrected.','FIN-001/004 · EXC-006'],
['Branded/Scale seller selects warehouse, SKU, quantity, expiry and overflow policy → confirms','Atomically reserve stock, show expiry in Israel time and offer Create campaign link. Track held, sold and remaining quantities.','Concurrent shortage: show fresh availability and retain draft. Expiry returns unused units; preserve active checkout holds. Social plan shows upgrade path.','INV-002/004/007 · SUB-003'],
['Seller selects eligible listings → chooses quantities and campaign → checks buyer preview → shares','Generate revocable link. Social preview contains image and seller name. Click opens current prices. Checkout locks all accepted cart lines together.','Changed price or missing SKU: identify affected line and request buyer confirmation. Revoked/expired link shows ended page. Link previews never lock stock.','WEB-001/004/005 · INV-006'],
['Warehouse operator opens deadline queue → accepts assigned task → scans bin and sell unit','Record picker and pick count. Advance to packing only after all required scans or authorized partial split.','Short pick: capture actual count and reason; isolate remaining commitment. Operations offers dated backorder or refund; create distinct parcel lines for shipped units.','ORD-003/004 · EXC-005'],
['Packer checks packaging instructions → scans mandatory materials → seals parcel','Persist packaging version and scan evidence. Validate parcel dimensions, weight, address and carrier service before label request.','Missing insert: block seal. Replenish or use recorded contractual fallback and fee adjustment. Lost label response: retrieve same label by shipment key.','ORD-005/006'],
['Dispatcher matches sealed parcel to label → confirms manifest and physical handoff','Count shipped units once, start parcel tracking, keep separate delivery and payout clocks.','Duplicate scan: return original handoff. Pre-handoff cancellation races with dispatch: lock shipment; route shipped goods to returns.','ORD-007/009 · FIN-008']
].map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div></article><details open><summary>Responsive layout, permissions and system states</summary><p>Desktop pairs the editable task with its decision summary. On phones the form precedes the summary; warehouse scans support keyboard Enter. Production Hebrew screens mirror navigation and keep SKU, barcode and tracking codes left-to-right.</p><p>Seller access is scoped to own listings and campaign pools. Supplier work is scoped to assigned warehouse tasks. Reveal delivery details during label generation only. Disable repeated submissions while awaiting acknowledgment, preserve drafts after retriable errors and display a pending reference on unknown outcomes.</p><p>Empty states: first listing → select catalog item; no campaign → reserve stock; no links → build first link; empty queue → show last sync and refresh. A stale warehouse feed blocks new reservations and checkout with a stock-verification message.</p></details>'}
const rows=['בלון ספרה 3 בגוון רוז גולד','סט 10 בלוני קונפטי','גליל סרט קשירה','קשת בלונים פסטל'].map((he,i)=>({he,en:['Rose gold number 3 balloon','Confetti balloons · 10 pack','Balloon ribbon roll','Pastel balloon arch'][i],price:[35,28,12,149][i],category:i===2?'Accessories':'Balloons',stock:[20,11,0,4][i],state:'Unreviewed',selected:false,assets:[],cost:null}));let activeRow=null,started=false,query='',cat='All',state='All',only=false,limitPrice='',mult=.55,src='https://supplier.example',adapter='Sitemap + JSON-LD';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pickOpts(a,v){return a.map(x=>'<option '+chosen(x,v)+'>'+esc(x)+'</option>').join('')}
function importer(){if(activeRow!==null)return studio();return '<article><span class="k">Anchor supplier · approved source</span><h2>Website product selector</h2><div class="row">'+field('Source URL','<input id="src" type="url" value="'+esc(src)+'">')+field('Connector','<select id="adapter">'+pickOpts(['Sitemap + JSON-LD','Shopify','WooCommerce','Konimbo','CashCow','XML / JSON feed','Merchant Center'],adapter)+'</select>')+field('Wholesale multiplier','<input id="mult" type="number" step=".01" value="'+mult+'">')+btn(started?'Re-sync sample':'Import sample','syncImport()','primary')+'</div></article>'+(started?'<article><h2>Staging queue</h2><div class="row">'+field('Search title / SKU','<input value="'+esc(query)+'" onchange="query=this.value;render()">')+field('Category','<select onchange="cat=this.value;render()">'+pickOpts(['All','Balloons','Accessories'],cat)+'</select>')+field('State','<select onchange="state=this.value;render()">'+pickOpts(['All','Unreviewed','Enriching','Review','Ignored','Published'],state)+'</select>')+field('Maximum site price (₪)','<input type="number" value="'+esc(limitPrice)+'" onchange="limitPrice=this.value;render()">')+field('In stock','<input type="checkbox" '+(only?'checked':'')+' onchange="only=this.checked;render()">')+'</div><p>'+btn('Select visible unreviewed','visible().forEach(r=>r.selected=r.state===\'Unreviewed\');render()')+' '+btn('Enrich selected ('+rows.filter(r=>r.selected).length+')','batch(true)','primary')+' '+btn('Ignore selected','batch(false)')+'</p><div class="wide"><table><tr><th>Select</th><th>Source title / SKU</th><th>Stock</th><th>Site price</th><th>Wholesale</th><th>State</th></tr>'+visible().map(r=>{let i=rows.indexOf(r);return '<tr><td><input aria-label="Select SKU '+i+'" type="checkbox" '+(r.selected?'checked ':'')+(r.state!=='Unreviewed'?'disabled':'')+' onchange="rows['+i+'].selected=this.checked;render()"></td><td>'+r.he+'<br><small>IMP-00'+i+'</small></td><td>'+r.stock+'</td><td>'+money(r.price)+'</td><td>'+money(r.cost??r.price*mult)+'</td><td>'+(r.state==='Review'||r.state==='Published'?btn(r.state,'activeRow='+i+';msg=\'\';render()'):r.state)+'</td></tr>'}).join('')+'</table></div></article>':'<p>Import a sample to review staged products. Source prices in this fixture share the same tax basis.</p>')}
function visible(){return rows.filter((r,i)=>(r.he+r.en+'IMP-00'+i).toLowerCase().includes(query.toLowerCase())&&(cat==='All'||r.category===cat)&&(state==='All'||r.state===state)&&(!only||r.stock>0)&&(!limitPrice||r.price<=Number(limitPrice)))}
function syncImport(){try{if(new URL($('src').value).protocol!=='https:')throw 0}catch{return tell('Enter a valid HTTPS supplier URL.')}let v=read('mult');if(v<=0||v>1)return tell('Multiplier must be greater than zero and at most one.');mult=v;src=$('src').value;adapter=$('adapter').value;started=true;tell('Four sample source identities reconciled. Previous reviews retained.')}
function batch(enrich){let set=rows.filter(r=>r.selected&&r.state==='Unreviewed');if(!set.length)return tell('Select unreviewed products first.');set.forEach(r=>{r.selected=false;r.state=enrich?'Enriching':'Ignored'});tell(enrich?'Preparing bilingual drafts and sample asset slots.':'Selected rows ignored.');if(enrich)setTimeout(()=>{set.forEach(r=>{r.state='Review';r.assets=['Supplier original','White studio cutout','Party table scene','Sunlit home scene'].map(name=>({name,ok:false}));r.cost=Math.round(r.price*mult*100)/100;r.descHE=r.he;r.descEN=r.en;r.tags=r.category;r.primary=1});render()},600)}
function studio(){let r=rows[activeRow],locked=r.state==='Published';function edit(label,key,rtl=false){return field(label,'<textarea '+(locked?'readonly':'')+' dir="'+(rtl?'rtl':'ltr')+'" onchange="rows[activeRow].'+key+'=this.value">'+esc(r[key])+'</textarea>')}return btn('← Staging queue','activeRow=null;msg=\'\';render()')+'<div class="grid"><article><span class="k">IMP-00'+activeRow+' · '+r.state+'</span><h2>Bilingual copy and metadata</h2>'+edit('Hebrew title','he',true)+edit('English title','en')+edit('Hebrew description','descHE',true)+edit('English description','descEN')+edit('Category / tags','tags')+edit('Hebrew highlights','bulletsHE',true)+edit('English highlights','bulletsEN')+edit('Hebrew SEO title and description','seoHE',true)+edit('English SEO title and description','seoEN')+field('Wholesale cost · ₪','<input type="number" '+(locked?'readonly':'')+' value="'+r.cost+'" onchange="rows[activeRow].cost=this.value===\'\'?null:Number(this.value)">')+field('MSRP · ₪','<input type="number" '+(locked?'readonly':'')+' value="'+(r.msrp??r.price)+'" onchange="rows[activeRow].msrp=Number(this.value)">')+'<p class="notice">Source provides no dimensions or inflation compatibility. Omit unverified claims.</p></article><aside><h2>Image curation studio</h2><p class="hint">Image slots simulate the review workflow. Compare each candidate with the supplier original before approving.</p>'+r.assets.map((a,i)=>'<div style="border:1px dashed #879991;padding:10px;margin:8px 0;background:'+(i===0?'#eae7e2':'#eff5ed')+'"><b>'+esc(a.name)+'</b><br><small>'+ (a.note?esc(a.note):'Sample asset slot')+'</small><div class="row"><label>Approve <input type="checkbox" '+(locked?'disabled ':'')+(a.ok?'checked':'')+' onchange="rows[activeRow].assets['+i+'].ok=this.checked"></label><label>Primary <input type="radio" name="primary" '+(locked?'disabled ':'')+(r.primary===i?'checked':'')+' onchange="rows[activeRow].primary='+i+'"></label>'+(!locked&&i>1?btn('Move earlier','moveAsset('+i+')'):'')+'</div></div>').join('')+(locked?'':field('Custom scene prompt','<input id="prompt">')+btn('Generate candidate','regen()')+field('Rights, pricing and bilingual facts verified','<input type="checkbox" '+(r.checked?'checked':'')+' onchange="rows[activeRow].checked=this.checked">')+btn('Publish to sample catalog','publishItem()','primary'))+'</aside></div>'}
function moveAsset(i){let r=rows[activeRow],p=r.assets[r.primary];[r.assets[i],r.assets[i-1]]=[r.assets[i-1],r.assets[i]];r.primary=r.assets.indexOf(p);render()}
function regen(){let p=$('prompt').value.trim();if(!p)return tell('Add a scene prompt.');rows[activeRow].assets.push({name:'Custom scene candidate',note:p,ok:false});tell('Candidate added for review.')}
function publishItem(){let r=rows[activeRow];if(!r.checked||!r.assets[r.primary]?.ok||![r.he,r.en,r.descHE,r.descEN,r.tags].every(x=>x.trim())||r.cost===null||r.cost<0)return tell('Check both languages, category, wholesale cost, rights and an approved primary asset.');r.state='Published';tell('Published approved sample content and selected assets.')}

render();setInterval(()=>{if(res&&now()>=end)render()},5000)
</script></html>
